name: Linux

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_FORCE_SYSTEM_BINARIES: 1
  CMAKE_BUILD_TYPE: "Release"
  DEBIAN_FRONTEND: "noninteractive"

jobs:
  x86_64-matrix:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: debian
            version: 12
          - distro: debian
            version: 13
          - distro: ubuntu
            version: 22.04
          - distro: ubuntu
            version: 24.04
    container:
      image: ${{ matrix.distro }}:${{ matrix.version }}
    steps:
      - name: get-cmake
        uses: lukka/get-cmake@v3.28.1

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install git
        run: |
          apt-get update -y
          apt-get install -y git

      - uses: actions/checkout@v4
        with:
          submodules: "recursive"
          fetch-depth: 0

      - name: Git config safe directory
        shell: bash
        run: bash ./scripts/${{ matrix.distro }}-${{ matrix.version }}/1.5-git-safe.sh

      - name: Install Dependencies
        run: bash ./scripts/${{ matrix.distro }}-${{ matrix.version }}/1-install-deps.sh

      - name: Display system information
        shell: bash
        run: |
          {
            echo "### System information"
            echo ""
            echo "| Key | Value |"
            echo "|---|---|"
            echo "| Runner | $RUNNER_OS / $RUNNER_ARCH |"
            echo "| Distro | $(. /etc/os-release && echo "$PRETTY_NAME") |"
            echo "| Kernel | $(uname -r) |"
            echo "| CPU | $(lscpu | awk -F: '/Model name/{gsub(/^[ \t]+/,"",$2); print $2; exit}') |"
            echo "| Cores | $(nproc) |"
            echo "| Memory | $(free -h | awk '/^Mem:/{print $2}') |"
            echo "| Disk free | $(df -h / | awk 'NR==2{print $4}') |"
            echo "| CMake | $(cmake --version 2>/dev/null | head -1) |"
            echo "| Ninja | $(ninja --version 2>/dev/null) |"
            echo "| GCC | $(gcc --version 2>/dev/null | head -1) |"
            echo "| Clang | $(clang --version 2>/dev/null | head -1) |"
            echo "| vcpkg | $(git -C vcpkg rev-parse --short HEAD 2>/dev/null) |"
            echo ""
            echo '```'
            uname -a
            lscpu | sed -n '1,20p'
            free -h
            df -h /
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Create Build Environment
        run: bash ./scripts/${{ matrix.distro }}-${{ matrix.version }}/2-configure.sh '-DCMAKE_TOOLCHAIN_FILE=./vcpkg/scripts/buildsystems/vcpkg.cmake -DVCPKG_OVERLAY_PORTS=./vcpkg-overlays'

      - name: Build Server
        run: bash ./scripts/${{ matrix.distro }}-${{ matrix.version }}/3-build.sh

      - name: Archive server artifact
        uses: actions/upload-artifact@v4
        with:
          name: BeamMP-Server.${{ matrix.distro }}.${{ matrix.version }}.x86_64
          path: ./bin/BeamMP-Server

      - name: Archive server debug info artifact
        uses: actions/upload-artifact@v4
        with:
          name: debuginfo.${{ matrix.distro }}.${{ matrix.version }}.x86_64
          path: ./bin/BeamMP-Server.debug

      - name: Build Tests
        run: bash ./scripts/${{ matrix.distro }}-${{ matrix.version }}/3-build-tests.sh

      - name: Install Runtime Dependencies
        run: bash ./scripts/${{ matrix.distro }}-${{ matrix.version }}/4-install-runtime-deps.sh

      - name: Test
        run: ./bin/BeamMP-Server-tests

  arm64-matrix:
    runs-on: ubuntu-22.04-arm
    env:
      VCPKG_DEFAULT_TRIPLET: "arm64-linux"
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: debian
            version: 12
          - distro: debian
            version: 13
          - distro: ubuntu
            version: 22.04
          - distro: ubuntu
            version: 24.04
    container:
      image: ${{ matrix.distro }}:${{ matrix.version }}
    steps:
      - name: get-cmake
        uses: lukka/get-cmake@v3.28.1

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install git
        run: |
          apt-get update -y
          apt-get install -y git

      - uses: actions/checkout@v4
        with:
          submodules: "recursive"
          fetch-depth: 0

      - name: Git config safe directory
        shell: bash
        run: bash ./scripts/${{ matrix.distro }}-${{ matrix.version }}/1.5-git-safe.sh

      - name: Install Dependencies
        run: bash ./scripts/${{ matrix.distro }}-${{ matrix.version }}/1-install-deps.sh

      - name: Display system information
        shell: bash
        run: |
          {
            echo "### System information"
            echo ""
            echo "| Key | Value |"
            echo "|---|---|"
            echo "| Runner | $RUNNER_OS / $RUNNER_ARCH |"
            echo "| Distro | $(. /etc/os-release && echo "$PRETTY_NAME") |"
            echo "| Kernel | $(uname -r) |"
            echo "| CPU | $(lscpu | awk -F: '/Model name/{gsub(/^[ \t]+/,"",$2); print $2; exit}') |"
            echo "| Cores | $(nproc) |"
            echo "| Memory | $(free -h | awk '/^Mem:/{print $2}') |"
            echo "| Disk free | $(df -h / | awk 'NR==2{print $4}') |"
            echo "| CMake | $(cmake --version 2>/dev/null | head -1) |"
            echo "| Ninja | $(ninja --version 2>/dev/null) |"
            echo "| GCC | $(gcc --version 2>/dev/null | head -1) |"
            echo "| Clang | $(clang --version 2>/dev/null | head -1) |"
            echo "| vcpkg | $(git -C vcpkg rev-parse --short HEAD 2>/dev/null) |"
            echo ""
            echo '```'
            uname -a
            lscpu | sed -n '1,20p'
            free -h
            df -h /
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Create Build Environment
        run: bash ./scripts/${{ matrix.distro }}-${{ matrix.version }}/2-configure.sh '-DCMAKE_TOOLCHAIN_FILE=./vcpkg/scripts/buildsystems/vcpkg.cmake -DVCPKG_OVERLAY_PORTS=./vcpkg-overlays'

      - name: Build Server
        run: bash ./scripts/${{ matrix.distro }}-${{ matrix.version }}/3-build.sh

      - name: Archive server artifact
        uses: actions/upload-artifact@v4
        with:
          name: BeamMP-Server.${{ matrix.distro }}.${{ matrix.version }}.arm64
          path: ./bin/BeamMP-Server

      - name: Archive server debug info artifact
        uses: actions/upload-artifact@v4
        with:
          name: debuginfo.${{ matrix.distro }}.${{ matrix.version }}.arm64
          path: ./bin/BeamMP-Server.debug

      - name: Build Tests
        run: bash ./scripts/${{ matrix.distro }}-${{ matrix.version }}/3-build-tests.sh

      - name: Install Runtime Dependencies
        run: bash ./scripts/${{ matrix.distro }}-${{ matrix.version }}/4-install-runtime-deps.sh

      - name: Test
        run: ./bin/BeamMP-Server-tests
