name: Windows

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  VCPKG_DEFAULT_TRIPLET: x64-windows-static
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  CMAKE_BUILD_TYPE: "Release"

jobs:
  windows-build:
    runs-on: windows-2022
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          runVcpkgInstall: true
          vcpkgJsonGlob: 'vcpkg.json'

      - name: Display system information
        shell: pwsh
        run: |
          $os   = Get-CimInstance Win32_OperatingSystem
          $cpu  = Get-CimInstance Win32_Processor | Select-Object -First 1
          $disk = Get-PSDrive C
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = if (Test-Path $vswhere) { & $vswhere -latest -products * -property installationVersion } else { "n/a" }
          $ninja = if (Get-Command ninja -ErrorAction SilentlyContinue) { ninja --version } else { "n/a" }
          $lines = @(
            "### System information",
            "",
            "| Key | Value |",
            "|---|---|",
            "| Runner | $env:RUNNER_OS / $env:RUNNER_ARCH |",
            "| OS | $($os.Caption) $($os.Version) |",
            "| CPU | $($cpu.Name.Trim()) |",
            "| Cores | $($cpu.NumberOfCores) physical / $($cpu.NumberOfLogicalProcessors) logical |",
            "| Memory | $([math]::Round($os.TotalVisibleMemorySize/1MB,1)) GB |",
            "| Disk free C: | $([math]::Round($disk.Free/1GB,1)) GB |",
            "| Visual Studio | $vs |",
            "| CMake | $((cmake --version | Select-Object -First 1)) |",
            "| Ninja | $ninja |",
            "| vcpkg | $(git -C vcpkg rev-parse --short HEAD) |"
          )
          $lines | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Create Build Environment
        shell: bash
        run: ./scripts/windows/1-configure.sh '-DVCPKG_OVERLAY_PORTS=./vcpkg-overlays'

      - name: Build Server
        shell: bash
        run: bash ./scripts/windows/2-build.sh

      - name: Archive server artifact
        uses: actions/upload-artifact@v4
        with:
          name: BeamMP-Server-windows
          path: ./bin/Release/BeamMP-Server.exe

